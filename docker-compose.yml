services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: '/app/data'
    volumes:
      - ./home_content_store:/app/home_content_store
      - ./data:/app/data

  compile:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["sh", "scripts/compile_requirements.sh"]
    profiles: ["tools"]
